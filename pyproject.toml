[project]
name = "organisation-app"
version = "0.1.0"
description = "A multi-purpose organisation app written in python."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.poe.tasks]
qa = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
    { cmd = "pytest" }
]
